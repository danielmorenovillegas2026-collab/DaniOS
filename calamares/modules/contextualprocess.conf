# ============================================================
#  Ejecuta el instalador del escritorio elegido dentro del
#  sistema destino. La clave la escribe packagechooser.
# ============================================================
---
dontChroot: false
timeout: 7200
verbose: true

packagechooser_packagechooser:
    gnome:    "/usr/local/sbin/danios-install-desktop gnome"
    kde:      "/usr/local/sbin/danios-install-desktop kde"
    xfce:     "/usr/local/sbin/danios-install-desktop xfce"
    cinnamon: "/usr/local/sbin/danios-install-desktop cinnamon"
    "":       "/bin/false no-se-ha-elegido-escritorio"
    "*":      "/bin/false escritorio-desconocido"
