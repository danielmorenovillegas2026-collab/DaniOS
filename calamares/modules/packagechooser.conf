# ============================================================
#  Selector de escritorio de DaniOS
#  method: legacy  ->  escribe la clave
#  packagechooser_packagechooser y la procesa contextualprocess
# ============================================================
---
mode: required
method: legacy

labels:
    step: "Escritorio"
    step[en]: "Desktop"

default: xfce

items:
    - id: gnome
      name: "GNOME"
      name[en]: "GNOME"
      description: "Escritorio moderno y táctil. Descarga ~1,2 GB durante la instalación."
      description[en]: "Modern, touch-friendly desktop. Downloads ~1.2 GB during installation."
      packages: [ task-gnome-desktop ]

    - id: kde
      name: "KDE Plasma"
      name[en]: "KDE Plasma"
      description: "El más personalizable. Descarga ~1,5 GB durante la instalación."
      description[en]: "The most customizable. Downloads ~1.5 GB during installation."
      packages: [ task-kde-desktop ]

    - id: xfce
      name: "XFCE"
      name[en]: "XFCE"
      description: "Ligero y rápido. Ya viene incluido: instalación sin descargas."
      description[en]: "Light and fast. Already included: no downloads needed."
      packages: [ task-xfce-desktop ]

    - id: cinnamon
      name: "Cinnamon"
      name[en]: "Cinnamon"
      description: "Clásico y familiar, al estilo de Windows. Descarga ~1 GB."
      description[en]: "Classic and familiar, Windows-style. Downloads ~1 GB."
      packages: [ task-cinnamon-desktop ]
