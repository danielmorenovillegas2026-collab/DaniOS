# ============================================================
#  DaniOS — configuración de Calamares
# ============================================================
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances: []

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - packagechooser
        - summary

    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - networkcfg
        - hwclock
        - services-systemd
        - contextualprocess
        - shellprocess
        - grubcfg
        - bootloader
        - initramfscfg
        - initramfs
        - umount

    - show:
        - finished

branding: danios

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
